name: The Data Guild
description: The Data Guild is a San Francisco-based venture studio, founded in 2013, that builds
  data-driven companies addressing challenges in healthcare, life sciences, renewable energy, and
  climate change. Steeped in machine learning, data science, and artificial intelligence, the Guild
  pioneers a co-creation model that converts LP capital into equity across a portfolio of new ventures
  while applying its own team's efforts directly rather than simply allocating capital. It brings
  products to market through spinouts, alongside portfolio-company teams, and with strategic partners.
  Investors include Bloomberg Beta, David Gutelius, and Silicon Valley Data Capital. The Data Guild
  operates a marketing/company website and publishes no public API, developer documentation, SDKs, or
  MCP surface; this profile captures its identity and a domain-security probe.
